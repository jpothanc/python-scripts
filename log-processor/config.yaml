settings:
  # Optional if you pass --start-date on the command line
  start_date: 2026-06-01

  # Output Excel workbook (relative paths are resolved from this config file's folder)
  output_file: log_analysis.xlsx

  # Business hours window (inclusive). Used for the Business Hours Y/N column.
  business_hours:
    start: "09:00"
    end: "16:00"

# Log line pattern to match. Use x or X where the numeric duration appears in the log.
# Example log line: "DB retrieval took 150 millis"
line_pattern: "DB retrieval took x millis"

# Divide the captured number by this to produce seconds (1000 = millis, 1 = already seconds)
value_divisor: 1000

# Only include lines where duration is greater than this many seconds (0 = include all)
min_seconds: 0

# Optional if you pass -f/--log-file or positional paths on the command line
log_files:
  - sample_logs/server-a.log
  - sample_logs/server-b.log
